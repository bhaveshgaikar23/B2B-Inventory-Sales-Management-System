

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Inventory System</h2>

            <nav>
                <a href="admin-dashboard.html">Dashboard</a>
                <a href="admin-products.html" class="active">Products</a>
                <a href="#">Categories</a>
                <a href="#">Suppliers</a>
                <a href="#">Orders</a>
                <a href="#">Stock Management</a>
                <a href="#">Shopkeeper Approvals</a>
                <a href="#">Reports</a>
            </nav>

            <button id="logoutBtn">Logout</button>
        </aside>

        <main class="main-content">
            <header>
                <h1>Manage Products</h1>
                <p>Add, view and update inventory products</p>
            </header>

            <section class="stat-card">
                <h3 id="productFormTitle">Add New Product</h3>

                <form id="addProductForm">
                    <input type="hidden" id="editingProductID">

                    <label for="categoryID">Category ID</label>
                    <input type="number" id="categoryID"
                           min="1" required>

                    <label for="supplierID">Supplier ID</label>
                    <input type="number" id="supplierID"
                           min="1" required>

                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" required>

                    <label for="sku">SKU</label>
                    <input type="text" id="sku" required>

                    <label for="wholesalePrice">Wholesale Price</label>
                    <input type="number" id="wholesalePrice"
                           min="0.01" step="0.01" required>

                    <label for="minOrderQuantity">Minimum Order Quantity</label>
                    <input type="number" id="minOrderQuantity"
                           min="1" required>

                    <label for="maxOrderQuantity">Maximum Order Quantity</label>
                    <input type="number" id="maxOrderQuantity"
                           min="1" required>

                    <button type="submit" id="saveProductBtn">
                        Add Product
                    </button>

                    <button type="button" id="cancelEditBtn"
                            style="display:none;">
                        Cancel Edit
                    </button>
                </form>

                <p id="addProductMessage" role="status"></p>
            </section>

            <section class="stat-card" style="margin-top:25px;">
                <h3>Product List</h3>

                <div style="overflow-x:auto;">
                    <table id="productsTable" border="1"
                           cellpadding="12" cellspacing="0"
                           style="width:100%; border-collapse:collapse;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>SKU</th>
                                <th>Wholesale Price</th>
                                <th>Stock</th>
                                <th>Min Order</th>
                                <th>Max Order</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="productsBody">
                            <tr>
                                <td colspan="8">Loading products...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="productsMessage" role="status"></p>
            </section>
        </main>
    </div>

    <script src="js/admin-products.js"></script>
</body>
</html>
